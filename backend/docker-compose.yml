version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: smart_irrigation_db
      POSTGRES_USER: smart_irrigation_user
      POSTGRES_PASSWORD: smart_irrigation_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_irrigation_user -d smart_irrigation_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Application
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://smart_irrigation_user:smart_irrigation_password@db:5432/smart_irrigation_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker for background tasks
  celery_worker:
    build: .
    command: celery -A app.utils.scheduler worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://smart_irrigation_user:smart_irrigation_password@db:5432/smart_irrigation_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat for scheduled tasks
  celery_beat:
    build: .
    command: celery -A app.utils.scheduler beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://smart_irrigation_user:smart_irrigation_password@db:5432/smart_irrigation_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates directory
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
